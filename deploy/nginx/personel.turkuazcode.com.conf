# Personel Sistemi — /etc/nginx/sites-available/personel.turkuazcode.com
# Uygulama Docker konteynerinde 127.0.0.1:8100 üzerinde çalışır (deploy/docker-compose.yml).
# HTTPS (443) bloğunu ve HTTP → HTTPS yönlendirmesini certbot --nginx ekler.

server {
    listen 80;
    listen [::]:80;
    server_name personel.turkuazcode.com;

    client_max_body_size 2m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        # İstemcinin gönderdiği X-Forwarded-For yok sayılır, gerçek IP yazılır (rate limit için)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }
}
